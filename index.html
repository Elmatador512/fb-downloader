<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Téléchargeur Facebook HD</title>
<style>
body{font-family:Arial;text-align:center;padding:20px;background:#f0f2f5;margin:0;}
.hero{background:white;padding:25px;border-radius:12px;max-width:500px;margin:20px auto;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
h1{color:#1877f2;margin:0;}
input{width:85%;padding:12px;margin:15px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;}
button{background:#1877f2;color:white;padding:14px 25px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:16px;width:90%;}
.btn-soutien{background:#FF7732;margin-top:12px;}
#resultat{margin-top:15px;font-weight:bold;min-height:20px;}
.how{background:white;padding:20px;border-radius:12px;max-width:500px;margin:20px auto;text-align:left;}
footer{margin-top:20px;font-size:12px;color:#888;}
a{color:#1877f2;font-weight:bold;}
</style>
</head>
<body>

<div class="hero">
<h1>Téléchargeur Facebook</h1>
<p>Télécharge n'importe quelle vidéo Facebook en MP4 HD gratuitement</p>
<input type="text" id="url" placeholder="Colle le lien Facebook ici" />
<button onclick="telechargerVideo()">Télécharger</button>
<button class="btn-soutien" onclick="ouvrirPub()">🔥 Regarder une vidéo pour me soutenir</button>
<div id="resultat"></div>
</div>

<div class="how">
<h2>Comment télécharger ?</h2>
<p>1. Copiez le lien de la vidéo Facebook</p>
<p>2. Collez-le ici</p>
<p>3. Cliquez sur Télécharger</p>
</div>

<footer>
<p>© 2026 Téléchargeur FB | Politique de confidentialité | Contact</p>
</footer>

<script>
function ouvrirPub(){
window.open("https://www.profitableratecpm.com/56e69b29fa7bf8f07ffca0d2d2453c9d","_blank");
alert("Merci pour ton soutien ❤️");
}

async function telechargerVideo(){
const URL=document.getElementById("url").value;
const resultatDiv=document.getElementById("resultat");
if(!URL.trim()||!URL.includes("facebook.com")){
resultatDiv.innerHTML="❌ Colle un vrai lien Facebook svp";return;
}

// 1. OUVRIR LA PUB D'ABORD
let pub = window.open("https://www.profitableratecpm.com/56e69b29fa7bf8f07ffca0d2d2453c9d","_blank");

// 2. SI CHROME BLOQUE ON AFFICHE LE LIEN À CLIQUER
if(!pub || pub.closed || typeof pub.closed=='undefined'){
    resultatDiv.innerHTML = '⚠️ Autorise les popups. <a href="https://www.profitableratecpm.com/56e69b29fa7bf8f07ffca0d2d2453c9d" target="_blank">Clique ici pour Ouvrir la Pub</a><br>';
}else{
    resultatDiv.innerHTML = "⏳ Pub ouverte... Prépare le téléchargement";
}

setTimeout(async()=>{
try{
const response=await fetch("https://api.cobalt.tools/api/json",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({url:URL})
});
const data=await response.json();
if(data.url){
window.open(data.url,"_blank");
resultatDiv.innerHTML += "<br>✅ Téléchargement lancé !";
}else{
resultatDiv.innerHTML += "<br>❌ Lien invalide ou vidéo privée";
}
}catch(e){
resultatDiv.innerHTML += "<br>❌ Erreur. Réessayes";
}
},1500); // 1.5s pour laisser la pub charger
}
</script>
</body>
</html>
