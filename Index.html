<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Downloader - FB, TikTok, IG, YT</title>

<!-- SOCIAL BAR - CELUI QUI MARCHE EN CI - ON LE GARDE -->
<script src="https://pl30647807.profitableratecpmnetwork.com/99/d4/d8/99d4d80f50cdc1d42f1d538feefeaa71.js"></script>

<style>
body{font-family:'Segoe UI',Arial,sans-serif;text-align:center;padding:20px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;margin:0;}
.hero{background:white;padding:30px 20px;border-radius:20px;max-width:500px;margin:50px auto;box-shadow:0 10px 30px rgba(0,0,0,0.2);}
.logos{display:flex;justify-content:center;gap:12px;margin:15px 0 20px 0;}
.logos img{width:42px;height:42px;border-radius:12px;background:#f8f9fa;padding:6px;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
input{width:70%;padding:12px;border:1px solid #ccc;border-radius:10px;}
.input-group{display:flex;align-items:center;gap:5px;justify-content:center;margin-bottom:10px;}
.btn-annuler{background:#6c757d!important;width:25%!important;padding:12px 5px!important;font-size:12px!important;}
button{background:#1877f2;color:white;padding:14px 20px;border:none;border-radius:12px;font-weight:bold;cursor:pointer;width:90%;font-size:16px;margin:5px 0;}
.how-it-works{text-align:left;max-width:500px;margin:20px auto;background:#f8f9fa;padding:15px;border-radius:12px;}
footer{margin-top:30px;font-size:12px;color:white;}
#result{margin-top:15px;font-weight:bold;min-height:20px;}
</style>
</head>
<body>

<div class="hero">
<h2>Video Downloader</h2>

<!-- VRAIS LOGOS OFFICIELS -->
<div class="logos">
  <img src="https://img.icons8.com/color/48/tiktok--v1.png" alt="TikTok">
  <img src="https://img.icons8.com/color/48/youtube-play.png" alt="YouTube">
  <img src="https://img.icons8.com/color/48/facebook-new.png" alt="Facebook">
  <img src="https://img.icons8.com/color/48/instagram-new--v1.png" alt="Instagram">
</div>

<p>Télécharge n'importe quelle vidéo FB, TikTok, Insta, YT en MP4 HD gratuitement</p>

<div class="input-group">
<input type="text" id="url" placeholder="Colle le lien ici" />
<button class="btn-annuler" onclick="annuler()">Annuler</button>
</div>

<button onclick="downloadVideo()">Télécharger</button>
<div id="result"></div>
</div>

<div class="how-it-works">
<h2>Comment télécharger?</h2>
<p>1. Copiez le lien de la vidéo</p>
<p>2. Collez-le ici</p>
<p>3. Cliquez sur Télécharger</p>
</div>

<footer><p>© 2026 FB Downloader | Politique | Contact</p></footer>

<script>
function annuler(){document.getElementById('url').value='';document.getElementById('result').innerHTML='';}

async function downloadVideo(){
const url=document.getElementById('url').value.trim();
const resultDiv=document.getElementById('result');
if(!url){resultDiv.innerHTML="❌ Collez un vrai lien svp";return;}

resultDiv.innerHTML="⏳ Recherche de la vidéo...";

try{
 let dl=null;
 if(url.includes("tiktok.com")){
   const r=await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}&hd=1`);
   const data=await r.json();
   if(data.data && data.data.play){
     dl = data.data.hdplay || data.data.play;
   }
 } else {
   const r=await fetch("https://co.wuk.sh/api/json",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:url})});
   const data=await r.json();
   if(data.url) dl=data.url;
   else if(data.picker && data.picker.length>0){dl=data.picker[0].url;}
 }

 if(dl){
   resultDiv.innerHTML=`<a href="${dl}" target="_blank" style="display:block;background:#00c851;color:white;padding:12px;border-radius:10px;text-decoration:none;">✅ CLIQUE ICI POUR TÉLÉCHARGER HD</a>`;
 } else {
   resultDiv.innerHTML="❌ Lien expiré ou privé. Prends le lien long tiktok.com/@...";
 }
}catch(e){
 resultDiv.innerHTML="❌ Erreur réseau. Réessaye.";
}
}
</script>
</body>
</html>
